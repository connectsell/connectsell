# connectsell.co.kr — 가비아 FTP 동기화 (선택)
#
# ■ 실제 공개 URL (https://www.connectsell.co.kr/...) 은 Vercel이 GitHub main 과 연동해 배포합니다.
#   응답 헤더: Server: Vercel — HTML 반영은 main 푸시만으로도 됩니다.
#
# ■ 이 워크플로는 "가비아 웹호스팅 FTP"에 babinola.html 을 한 번 더 올릴 때 사용합니다.
#   이전 실패( run #10 ): appleboy/scp-action = SSH(SCP) 전용 → FTP(21) 계정으로는 인증 불가.
#
# ■ GitHub Secrets (Settings → Secrets → Actions)
#   CONNECTSELL_FTP_HOST      FTP 호스트 (예: ftp.xxx.co.kr)
#   CONNECTSELL_FTP_USER      FTP 아이디
#   CONNECTSELL_FTP_PASSWORD  FTP 비밀번호
#   CONNECTSELL_FTP_PORT      (선택) 기본 21. 비우면 21.
#   CONNECTSELL_FTP_WEBROOT   FTP 로그인 후 babinola.html 이 올라갈 디렉터리 (끝에 / 필수)
#                             예: public_html/email/marocell/  (가비아 홈 기준 상대경로)
#                             또는 호스트가 절대경로를 요구하면 /home/.../public_html/email/marocell/
#
# ■ 로그 확인: Actions 탭 → 실패한 run → Upload 단계에서 curl 이 530(로그인 실패), 550(경로 오류),
#   Connection refused 등을 출력합니다.

name: Deploy babinola email to connectsell.co.kr

on:
  push:
    branches: [ "main" ]
    paths:
      - "email/marocell/babinola.html"
      - "email/images/babinola*"
      - ".github/workflows/deploy-connectsell-co-kr.yml"
  workflow_dispatch: {}

jobs:
  ftp_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage babinola.html
        run: |
          mkdir -p _ftp_publish
          cp email/marocell/babinola.html _ftp_publish/babinola.html

      - name: Validate secrets shape
        env:
          WEBROOT: ${{ secrets.CONNECTSELL_FTP_WEBROOT }}
        run: |
          if [ -z "$WEBROOT" ]; then echo "::error::CONNECTSELL_FTP_WEBROOT is empty"; exit 1; fi
          case "$WEBROOT" in
            */) ;;
            *) echo "::error::CONNECTSELL_FTP_WEBROOT must end with / (got length ${#WEBROOT})"; exit 1 ;;
          esac

      # curl: FTP 업로드 + -v 로 실제 서버 응답(530/550 등)이 로그에 남음. 비밀번호는 GitHub 가 마스킹.
      - name: Upload babinola.html via FTP (curl verbose)
        env:
          FTP_USER: ${{ secrets.CONNECTSELL_FTP_USER }}
          FTP_PASS: ${{ secrets.CONNECTSELL_FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.CONNECTSELL_FTP_HOST }}
          FTP_PORT: ${{ secrets.CONNECTSELL_FTP_PORT }}
          FTP_DIR: ${{ secrets.CONNECTSELL_FTP_WEBROOT }}
        run: |
          set -euxo pipefail
          # 호스트에 ftp:// 가 들어가면 ftp://ftp://... 이 되므로 제거
          H="${FTP_HOST#ftp://}"
          H="${H#ftps://}"
          H="${H%/}"
          PORT="${FTP_PORT:-21}"
          DIR="${FTP_DIR#/}"
          if [ "$PORT" = "21" ]; then
            REMOTE_URL="ftp://${H}/${DIR}babinola.html"
          else
            REMOTE_URL="ftp://${H}:${PORT}/${DIR}babinola.html"
          fi
          echo "Upload target: ${FTP_DIR}babinola.html on ${H} (port ${PORT})"
          export FTP_HOST="$H"
          export FTP_PORT="$PORT"
          # 1) 일반 FTP  2) FTPS(명시적 TLS)  3) Python ftplib (일부 curl/패시브 이슈 우회)
          curl --fail --verbose --connect-timeout 45 \
            --ftp-skip-pasv-ip \
            -T _ftp_publish/babinola.html \
            --user "${FTP_USER}:${FTP_PASS}" \
            "${REMOTE_URL}" \
          || curl --fail --verbose --connect-timeout 45 \
            --ftp-skip-pasv-ip \
            --ftp-ssl --ssl-reqd \
            -T _ftp_publish/babinola.html \
            --user "${FTP_USER}:${FTP_PASS}" \
            "${REMOTE_URL}" \
          || python3 << 'PY'
          import os, sys
          from ftplib import FTP, FTP_TLS

          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          password = os.environ["FTP_PASS"]
          port = int(os.environ.get("FTP_PORT") or "21")
          webroot = os.environ["FTP_DIR"].rstrip("/")

          def cwd_path(ftp, path: str) -> None:
              if path.startswith("/"):
                  try:
                      ftp.cwd("/")
                  except Exception:
                      pass
              for part in [p for p in path.split("/") if p]:
                  ftp.cwd(part)

          last_err = None
          for use_tls, label in ((False, "FTP"), (True, "FTP_TLS")):
              try:
                  if use_tls:
                      ftp = FTP_TLS()
                      ftp.connect(host, port, timeout=60)
                      ftp.login(user, password)
                      ftp.prot_p()
                  else:
                      ftp = FTP()
                      ftp.connect(host, port, timeout=60)
                      ftp.login(user, password)
                  cwd_path(ftp, webroot)
                  with open("_ftp_publish/babinola.html", "rb") as f:
                      ftp.storbinary("STOR babinola.html", f)
                  ftp.quit()
                  print(f"OK ({label})")
                  sys.exit(0)
              except Exception as e:
                  last_err = e
                  print(f"{label} failed: {e!r}", flush=True)
          raise SystemExit(last_err)
          PY
