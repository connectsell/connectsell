<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신청 완료 | ConnectSell</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#1a1d23;color:#e8eaed;min-height:100vh;padding:24px 16px;display:flex;align-items:center;justify-content:center;}
.thanks-page{max-width:420px;width:100%;}
.thanks-box{background:#252830;border-radius:16px;padding:2.5rem 1.75rem;box-shadow:0 8px 32px rgba(0,0,0,0.4);text-align:center;}
.thanks-box .thanks-title{margin:0 0 1.25rem 0;font-size:1.25rem;font-weight:700;color:#fff;}
.thanks-box p{margin:0 0 0.75rem 0;font-size:0.9rem;line-height:1.65;color:#9ca3af;}
.thanks-box p:last-of-type{margin-bottom:0;}
.thanks-box .thanks-end{margin-top:1rem;font-weight:600;font-size:1rem;color:#e8eaed;}
.thanks-footer{margin-top:1.5rem;text-align:center;}
.thanks-footer a{color:#5a7a6a;font-weight:600;text-decoration:none;}
.thanks-footer a:hover{text-decoration:underline;color:#6b8b7b;}
</style>
</head>
<body>
<main class="thanks-page">
  <div class="thanks-box">
    <p class="thanks-title">공동구매 신청이 완료되었습니다</p>
    <p>입력해주신 정보를 확인한 후,<br>공동구매 참여 안내를 순차적으로 전달드릴 예정입니다.</p>
    <p>좋은 협업이 되도록 준비하겠습니다.</p>
    <p class="thanks-end">감사합니다.</p>
  </div>
  <footer class="thanks-footer">
    <a href="https://www.connectsell.co.kr/">ConnectSell 홈으로</a>
  </footer>
</main>
</body>
</html>
