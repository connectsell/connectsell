<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>샘플 신청 | ConnectSell (v3)</title>
<meta name="description" content="브랜드와 크리에이터를 연결해 지속 가능한 공동구매를 만듭니다.">
<meta property="og:url" content="https://www.connectsell.co.kr/sample/landing-v3.html">
<style>
*{box-sizing:border-box;}
body{margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#1a1d23;color:#e8eaed;min-height:100vh;padding:24px 16px;}
.v3-card{max-width:420px;margin:0 auto;background:#252830;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.v3-top-img{width:100%;height:280px;position:relative;overflow:hidden;background:#2d3139;}
.v3-top-img img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;opacity:0.9;}
.v3-top-img .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,0.7) 100%);pointer-events:none;}
.v3-top-img .hero-txt{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.6);}
.v3-top-img .hero-txt p:first-child{margin:0 0 4px 0;font-size:0.9rem;font-weight:500;letter-spacing:0.08em;opacity:0.95;}
.v3-top-img .hero-txt p:last-child{margin:0;font-size:2rem;font-weight:700;}
.v3-body{padding:28px 28px 36px;}
.v3-headline{margin:0 0 2px 0;font-size:1.1rem;font-weight:700;line-height:1.5;color:#fff;}
.v3-headline-spacer{margin:0 0 20px 0;}
.v3-desc{margin:0 0 24px 0;font-size:0.9rem;color:#9ca3af;line-height:1.6;}
.v3-form label{display:block;margin-bottom:8px;font-size:0.8rem;font-weight:500;color:#9ca3af;}
.v3-form input,.v3-form textarea{width:100%;padding:12px 14px;border:1px solid #3d4048;border-radius:8px;font-size:1rem;background:#1a1d23;color:#e8eaed;box-sizing:border-box;margin-bottom:20px;font-family:inherit;}
.v3-form textarea{rows:3;resize:vertical;}
.v3-form input::placeholder,.v3-form textarea::placeholder{color:#6b7280;}
.v3-btn{width:100%;padding:16px;background:#3F51B5;color:#fff;border:none;border-radius:8px;font-size:0.95rem;font-weight:500;cursor:pointer;}
.v3-btn:hover{background:#5c6bc0;}
@media (max-width:480px){
  .v3-top-img{height:240px;}
  .v3-body{padding:24px 20px 32px;}
}
</style>
</head>
<body>
<div class="v3-card">
  <div class="v3-top-img">
    <img src="images/hero-creator.jpg" alt="ConnectSell - Wellness Creator Commerce">
    <div class="hero-overlay"></div>
    <div class="hero-txt">
      <p>Wellness Creator Commerce</p>
      <p>ConnectSell</p>
    </div>
  </div>
  <div class="v3-body">
    <p class="v3-headline">당신의 경험이, 브랜드의 첫 문장이 됩니다.</p>
    <p class="v3-headline v3-headline-spacer">그 시작을 ConnectSell이 함께합니다.</p>
    <p class="v3-desc" style="margin-bottom:24px;">아래 정보를 남겨주시면,<br>브랜드를 먼저 경험하실 수 있도록 준비하겠습니다.</p>
    <form class="v3-form" action="https://formsubmit.co/connectsell01@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="[ConnectSell] 샘플 신청">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://www.connectsell.co.kr/sample/thanks.html">
      <label for="channel">채널명 <strong>*</strong></label>
      <input type="text" id="channel" name="channel" placeholder="유튜브/인스타그램 채널명" required>
      <label for="name">이름 <strong>*</strong></label>
      <input type="text" id="name" name="name" placeholder="본명" required>
      <label for="phone">전화번호 <strong>*</strong></label>
      <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required>
      <label for="address">샘플을 받으실 주소 (선택)</label>
      <input type="text" id="address" name="address" placeholder="주소를 입력해주세요">
      <label for="inquiry">문의사항 (선택)</label>
      <textarea id="inquiry" name="inquiry" placeholder="문의사항을 입력해주세요"></textarea>
      <button type="submit" class="v3-btn">샘플 신청하기</button>
    </form>
  </div>
</div>
</body>
</html>
