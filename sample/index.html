<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>샘플 신청 | ConnectSell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sample.css">
    <style>
        .sample-choose { text-align: center; padding: 3rem 2rem; }
        .sample-choose h2 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #2c3e50; }
        .sample-choose-links { display: flex; flex-direction: column; gap: 1rem; max-width: 280px; margin: 0 auto; }
        .sample-choose-links a { display: block; padding: 1rem 1.5rem; border-radius: 8px; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .sample-choose-simple { background: #fff; color: #4CAF50; border: 2px solid #4CAF50; }
        .sample-choose-simple:hover { background: #4CAF50; color: #fff; }
        .sample-choose-branding { background: #4CAF50; color: #fff; border: 2px solid #4CAF50; }
        .sample-choose-branding:hover { background: #45a049; border-color: #45a049; }

<body>
    <main class="sample-page">
        <header class="sample-header">
            <a href="https://www.connectsell.co.kr/" class="sample-logo">ConnectSell</a>

        <section class="sample-form-section sample-choose">
            <h2>샘플 신청 페이지를 선택해 주세요</h2>
            <div class="sample-choose-links">
                <a href="landing.html" class="sample-choose-branding">샘플 신청 (메인)</a>
                <a href="simple.html" class="sample-choose-simple">심플 버전</a>
                <a href="branding.html" class="sample-choose-simple">브랜딩 버전</a>
            </div>
            <p style="margin-top: 2rem; font-size: 0.85rem; color: #95a5a6;">선택 후 해당 페이지에서 폼 작성이 가능합니다.</p>
        </section>
    </main>
</body>
</html>
