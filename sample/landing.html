<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>샘플 신청 | ConnectSell</title>
</head>
<body style="margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#2c3e50;line-height:1.6;background:#0d1117;">
    <main style="max-width:480px;margin:0 auto;min-height:100vh;">
        <!-- 상단: 배경이미지 + 불투명도 + 로고 + 메인타이틀 -->
        <header style="position:relative;height:320px;background:url('https://www.connectsell.co.kr/sample/hero-bg.png') center/cover no-repeat;">
            <div style="position:absolute;inset:0;background:rgba(0,0,0,0.5);"></div>
            <div style="position:relative;z-index:1;padding:24px;">
                <a href="https://www.connectsell.co.kr/" style="font-size:1.25rem;font-weight:700;color:#fff;text-decoration:none;">ConnectSell</a>
            </div>
            <div style="position:absolute;bottom:0;left:0;right:0;padding:24px 20px 32px;z-index:1;">
                <div style="background:rgba(0,0,0,0.4);padding:20px 24px;border-radius:8px;">
                    <p style="margin:0 0 8px 0;font-size:0.9rem;color:rgba(255,255,255,0.9);">Wellness Creator Commerce</p>
                    <p style="margin:0;font-size:1.15rem;font-weight:700;color:#fff;line-height:1.5;">브랜드와 크리에이터를 연결해<br>지속 가능한 공동구매를 만듭니다</p>
                </div>
            </div>
        </header>

        <!-- 인플루언서 마음 움직이는 문구 + 폼 -->
        <section style="padding:32px 20px 40px;">
            <h2 style="margin:0 0 8px 0;font-size:1.4rem;font-weight:700;color:#fff;text-align:center;">당신의 진짜 리뷰가<br>브랜드의 이야기가 됩니다</h2>
            <p style="margin:0 0 28px 0;font-size:0.95rem;color:#8b949e;text-align:center;">아래 정보를 남겨주시면 샘플을 보내드립니다</p>

            <form action="https://formsubmit.co/connectsell01@gmail.com" method="POST" style="display:flex;flex-direction:column;gap:20px;">
                <input type="hidden" name="_subject" value="[ConnectSell] 샘플 신청">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_next" value="https://www.connectsell.co.kr/sample/thanks.html">

                <div>
                    <label style="display:block;margin-bottom:8px;font-size:0.9rem;font-weight:500;color:#fff;">채널명 *</label>
                    <input type="text" name="channel" placeholder="유튜브/인스타그램 채널명" required style="width:100%;padding:14px 16px;border:1px solid #30363d;border-radius:8px;font-size:1rem;background:#161b22;color:#fff;box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block;margin-bottom:8px;font-size:0.9rem;font-weight:500;color:#fff;">이름 *</label>
                    <input type="text" name="name" placeholder="본명" required style="width:100%;padding:14px 16px;border:1px solid #30363d;border-radius:8px;font-size:1rem;background:#161b22;color:#fff;box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block;margin-bottom:8px;font-size:0.9rem;font-weight:500;color:#fff;">전화번호 *</label>
                    <input type="tel" name="phone" placeholder="010-0000-0000" required style="width:100%;padding:14px 16px;border:1px solid #30363d;border-radius:8px;font-size:1rem;background:#161b22;color:#fff;box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block;margin-bottom:8px;font-size:0.9rem;font-weight:500;color:#fff;">샘플 받을 주소 (선택)</label>
                    <input type="text" name="address" placeholder="주소를 입력해주세요" style="width:100%;padding:14px 16px;border:1px solid #30363d;border-radius:8px;font-size:1rem;background:#161b22;color:#fff;box-sizing:border-box;">
                </div>
                <button type="submit" style="margin-top:8px;padding:16px 24px;background:#7c3aed;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;">샘플 신청하기</button>
            </form>
        </section>

        <!-- 푸터 -->
        <footer style="padding:24px 20px;text-align:center;border-top:1px solid #21262d;">
            <p style="margin:0 0 4px 0;font-size:0.9rem;font-weight:600;color:#8b949e;">ConnectSell</p>
            <p style="margin:0 0 4px 0;font-size:0.8rem;color:#6e7681;">커넥트셀 | CEO: 허연선 | 사업자번호 676-48-00866</p>
            <p style="margin:0;font-size:0.8rem;color:#6e7681;">서울특별시 마포구 마포대로52, 13층 1328호 | connectsell01@gmail.com</p>
        </footer>
    </main>
</body>
</html>
