<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>샘플 신청 | ConnectSell</title>
<meta name="description" content="브랜드와 크리에이터를 연결해 지속 가능한 공동구매를 만듭니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="ConnectSell">
<meta property="og:description" content="브랜드와 크리에이터를 연결해 지속 가능한 공동구매를 만듭니다.">
<meta property="og:image" content="https://www.connectsell.co.kr/sample/og-image.png">
<meta property="og:url" content="https://www.connectsell.co.kr/sample/landing.html">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ConnectSell">
<meta name="twitter:description" content="브랜드와 크리에이터를 연결해 지속 가능한 공동구매를 만듭니다.">
<meta name="twitter:image" content="https://www.connectsell.co.kr/sample/og-image.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<style>
*{box-sizing:border-box;}
body{margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#1a1d23;color:#e8eaed;min-height:100vh;padding:24px 16px;}
.v2-card{max-width:420px;margin:0 auto;padding-top:0;background:#252830;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.v2-top-img{width:100%;height:280px;position:relative;overflow:hidden;background:#2d3139;}
.v2-top-img img{width:100%;height:100%;object-fit:cover;display:block;}
.v2-top-img .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,0.7) 100%);pointer-events:none;z-index:1;}
.v2-top-img .hero-txt{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:2;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.6);}
.v2-top-img .hero-txt p:first-child{margin:0 0 4px 0;font-size:1.05rem;font-weight:500;letter-spacing:0.08em;opacity:0.95;white-space:nowrap;}
.v2-top-img .hero-txt p:last-child{margin:0;font-size:2rem;font-weight:700;}
.v2-body{padding:28px 28px 36px;}
.v2-headline{margin:0 0 2px 0;font-size:1.1rem;font-weight:700;line-height:1.5;color:#fff;}
.v2-headline-spacer{margin:0 0 20px 0;}
.v2-desc{margin:0 0 24px 0;font-size:0.9rem;color:#9ca3af;line-height:1.6;}
.v2-form label{display:block;margin-bottom:8px;font-size:0.8rem;font-weight:500;color:#9ca3af;}
.v2-form input,.v2-form select,.v2-form textarea{width:100%;padding:12px 14px;border:1px solid #3d4048;border-radius:8px;font-size:1rem;background:#1a1d23;color:#e8eaed;box-sizing:border-box;margin-bottom:20px;font-family:inherit;}
.v2-form select{cursor:pointer;appearance:auto;}
.v2-form textarea{rows:3;resize:vertical;}
.v2-form input::placeholder,.v2-form textarea::placeholder{color:#6b7280;}
.v2-btn{width:100%;padding:16px;background:#3F51B5;color:#fff;border:none;border-radius:8px;font-size:0.95rem;font-weight:500;cursor:pointer;}
.v2-btn:hover{background:#5c6bc0;}
@media (max-width:480px){
  .v2-top-img{height:240px;}
  .v2-body{padding:24px 20px 32px;}
}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="v2-card">
  <div class="v2-top-img">
    <img src="images/hero-creator.jpg" alt="ConnectSell - Wellness Creator Commerce">
    <div class="hero-overlay"></div>
    <div class="hero-txt">
      <p>Wellness&nbsp;Creator&nbsp;Commerce</p>
      <p>ConnectSell</p>
    </div>
  </div>
  <div class="v2-body">
    <p class="v2-headline">당신의 경험이, 브랜드의 첫 문장이 됩니다.</p>
    <p class="v2-headline v2-headline-spacer">그 시작을 ConnectSell이 함께합니다.</p>
    <p class="v2-desc" style="margin-bottom:24px;">아래 정보를 남겨주시면,<br>브랜드를 먼저 경험하실 수 있도록 준비하겠습니다.</p>
    <iframe name="form-frame" id="form-frame" style="display:none;"></iframe>
    <form class="v2-form" id="sample-form" action="https://formsubmit.co/connectsell01@gmail.com" method="POST" target="form-frame">
      <input type="hidden" name="_subject" id="form-subject" value="[샘플신청]">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="">
      <label for="product">상품명 <strong>*</strong></label>
      <input type="text" id="product" name="product" placeholder="예: 바비놀라" required autocomplete="off">
      <label for="channel_type">채널 유형 <strong>*</strong></label>
      <select id="channel_type" name="channel_type" required>
        <option value="" disabled selected>채널 유형을 선택해 주세요</option>
        <option value="인스타그램">인스타그램</option>
        <option value="유튜브">유튜브</option>
        <option value="틱톡">틱톡</option>
      </select>
      <label for="channel">채널 ID <strong>*</strong></label>
      <input type="text" id="channel" name="channel" placeholder="@핸들 또는 채널명" required>
      <label for="name">이름 <strong>*</strong></label>
      <input type="text" id="name" name="name" placeholder="본명" required>
      <label for="phone">전화번호 <strong>*</strong></label>
      <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required>
      <label for="address">샘플을 받으실 주소 (선택)</label>
      <input type="text" id="address" name="address" placeholder="주소를 입력해주세요">
      <label for="inquiry">문의사항 (선택)</label>
      <textarea id="inquiry" name="inquiry" placeholder="문의사항을 입력해주세요"></textarea>
      <button type="submit" class="v2-btn" id="submit-btn">샘플 신청하기</button>
    </form>
  </div>
</div>
<script>
(function(){
  var form = document.getElementById('sample-form');
  var btn = document.getElementById('submit-btn');
  var subjectEl = document.getElementById('form-subject');
  if (!form || !btn) return;

  function fillProductFromQuery() {
    try {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('product');
      if (!p) return;
      var el = document.getElementById('product');
      if (!el) return;
      var decoded = decodeURIComponent(p.replace(/\+/g, ' ')).trim();
      if (decoded) el.value = decoded;
    } catch (e) {}
  }
  fillProductFromQuery();

  form.addEventListener('submit', function() {
    var productEl = document.getElementById('product');
    var channelTypeEl = document.getElementById('channel_type');
    var channelEl = document.getElementById('channel');
    var product = (productEl && productEl.value.trim()) ? productEl.value.trim() : '(미입력)';
    var channelType = channelTypeEl && channelTypeEl.value ? channelTypeEl.value : '(미입력)';
    var channelId = (channelEl && channelEl.value.trim()) ? channelEl.value.trim() : '(미입력)';
    if (subjectEl) {
      subjectEl.value = '[샘플신청] ' + product + ' / ' + channelType + ' / ' + channelId;
    }
    btn.disabled = true;
    btn.textContent = '전송 중...';
    setTimeout(function() {
      window.location.href = 'thanks.html';
    }, 800);
  });
})();
</script>
</body>
</html>
