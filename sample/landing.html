<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>샘플 신청 | ConnectSell</title>
</head>
<body style="margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;min-height:100vh;background:url('https://www.connectsell.co.kr/sample/hero-bg.png') center/cover no-repeat fixed;">
    <!-- 전체 배경 오버레이: 이미지 위에 그린 톤 + 어두운 레이어 -->
    <div style="position:fixed;inset:0;background:linear-gradient(180deg,rgba(45,80,55,0.75) 0%,rgba(30,50,35,0.9) 50%,rgba(20,35,25,0.95) 100%);z-index:0;"></div>

    <main style="position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;padding:28px 20px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <!-- 로고 -->
        <a href="https://www.connectsell.co.kr/" style="position:absolute;top:24px;left:20px;font-size:1.35rem;font-weight:700;color:#fff;text-decoration:none;text-shadow:0 2px 8px rgba(0,0,0,0.3);">ConnectSell</a>

        <!-- 메인 타이틀 (배경 이미지 위에) -->
        <div style="text-align:center;margin-bottom:32px;">
            <p style="margin:0 0 6px 0;font-size:0.85rem;color:rgba(255,255,255,0.9);letter-spacing:0.05em;">Wellness Creator Commerce</p>
            <p style="margin:0;font-size:1.2rem;font-weight:700;color:#fff;line-height:1.5;text-shadow:0 2px 12px rgba(0,0,0,0.4);">브랜드와 크리에이터를 연결해<br>지속 가능한 공동구매를 만듭니다</p>
        </div>

        <!-- 폼 카드: ConnectSell 브랜딩 -->
        <div style="width:100%;background:rgba(255,255,255,0.97);border-radius:16px;padding:28px 24px;box-shadow:0 8px 32px rgba(0,0,0,0.2);">
            <h2 style="margin:0 0 6px 0;font-size:1.25rem;font-weight:700;color:#2c3e50;text-align:center;">당신의 진짜 리뷰가<br>브랜드의 이야기가 됩니다</h2>
            <p style="margin:0 0 24px 0;font-size:0.9rem;color:#7f8c8d;text-align:center;">아래 정보를 남겨주시면 샘플을 보내드립니다</p>

            <form action="https://formsubmit.co/connectsell01@gmail.com" method="POST" style="display:flex;flex-direction:column;gap:18px;">
                <input type="hidden" name="_subject" value="[ConnectSell] 샘플 신청">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_next" value="https://www.connectsell.co.kr/sample/thanks.html">

                <div>
                    <label style="display:block;margin-bottom:6px;font-size:0.875rem;font-weight:600;color:#2c3e50;">채널명 *</label>
                    <input type="text" name="channel" placeholder="유튜브/인스타그램 채널명" required style="width:100%;padding:14px 16px;border:1px solid #e0e0e0;border-radius:10px;font-size:1rem;background:#fff;color:#2c3e50;box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;font-size:0.875rem;font-weight:600;color:#2c3e50;">이름 *</label>
                    <input type="text" name="name" placeholder="본명" required style="width:100%;padding:14px 16px;border:1px solid #e0e0e0;border-radius:10px;font-size:1rem;background:#fff;color:#2c3e50;box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;font-size:0.875rem;font-weight:600;color:#2c3e50;">전화번호 *</label>
                    <input type="tel" name="phone" placeholder="010-0000-0000" required style="width:100%;padding:14px 16px;border:1px solid #e0e0e0;border-radius:10px;font-size:1rem;background:#fff;color:#2c3e50;box-sizing:border-box;">
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;font-size:0.875rem;font-weight:600;color:#2c3e50;">샘플 받을 주소 (선택)</label>
                    <input type="text" name="address" placeholder="주소를 입력해주세요" style="width:100%;padding:14px 16px;border:1px solid #e0e0e0;border-radius:10px;font-size:1rem;background:#fff;color:#2c3e50;box-sizing:border-box;">
                </div>
                <button type="submit" style="margin-top:6px;padding:16px 24px;background:#4CAF50;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(76,175,80,0.35);">샘플 신청하기</button>
            </form>
        </div>

        <!-- 푸터 -->
        <footer style="margin-top:28px;text-align:center;">
            <p style="margin:0 0 4px 0;font-size:0.9rem;font-weight:600;color:rgba(255,255,255,0.95);">ConnectSell</p>
            <p style="margin:0 0 4px 0;font-size:0.8rem;color:rgba(255,255,255,0.8);">커넥트셀 | CEO: 허연선 | 사업자번호 676-48-00866</p>
            <p style="margin:0;font-size:0.8rem;color:rgba(255,255,255,0.8);">서울특별시 마포구 마포대로52, 13층 1328호 | connectsell01@gmail.com</p>
        </footer>
    </main>
</body>
</html>
