<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>샘플 신청 | ConnectSell</title>
</head>
<body style="margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f8f6f3;color:#3d4f42;">
<header style="position:absolute;top:0;left:0;z-index:10;">
  <a href="https://www.connectsell.co.kr/" style="display:inline-block;padding:16px 24px;background:rgba(90,122,106,0.9);font-size:1.05rem;font-weight:600;color:#fff;text-decoration:none;letter-spacing:0.02em;">ConnectSell</a>
</header>

<div style="position:relative;width:100%;min-height:55vh;background:url('https://www.connectsell.co.kr/sample/hero-bg.png') center/contain no-repeat;background-color:#e5e8e4;">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
    <div style="max-width:340px;padding:32px 28px;background:rgba(61,79,66,0.82);text-align:center;border-radius:4px;">
      <p style="margin:0 0 12px 0;font-size:0.7rem;color:rgba(255,255,255,0.9);letter-spacing:0.15em;">WELLNESS CREATOR COMMERCE</p>
      <p style="margin:0;font-size:1.35rem;font-weight:600;color:#fff;line-height:1.6;letter-spacing:-0.01em;">브랜드와 크리에이터를 연결해<br>지속 가능한 공동구매를 만듭니다</p>
    </div>
  </div>
</div>

<main style="max-width:440px;margin:0 auto;padding:48px 24px 64px;">

  <p style="margin:0 0 8px 0;font-size:1.2rem;font-weight:600;color:#3d4f42;line-height:1.6;letter-spacing:-0.01em;">당신의 진짜 리뷰가<br>브랜드의 이야기가 됩니다</p>
  <p style="margin:0 0 36px 0;font-size:0.9rem;color:#6b7c6e;">아래 정보를 남겨주시면 샘플을 보내드립니다</p>

  <form action="https://formsubmit.co/connectsell01@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="[ConnectSell] 샘플 신청">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://www.connectsell.co.kr/sample/thanks.html">

    <div style="margin-bottom:24px;">
      <label style="display:block;margin-bottom:10px;font-size:0.8rem;font-weight:500;color:#4a5d52;letter-spacing:0.02em;">채널명 *</label>
      <input type="text" name="channel" placeholder="유튜브/인스타그램 채널명" required style="width:100%;padding:14px 0;border:none;border-bottom:1.5px solid #c5d0c5;font-size:1rem;background:transparent;color:#3d4f42;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:24px;">
      <label style="display:block;margin-bottom:10px;font-size:0.8rem;font-weight:500;color:#4a5d52;letter-spacing:0.02em;">이름 *</label>
      <input type="text" name="name" placeholder="본명" required style="width:100%;padding:14px 0;border:none;border-bottom:1.5px solid #c5d0c5;font-size:1rem;background:transparent;color:#3d4f42;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:24px;">
      <label style="display:block;margin-bottom:10px;font-size:0.8rem;font-weight:500;color:#4a5d52;letter-spacing:0.02em;">전화번호 *</label>
      <input type="tel" name="phone" placeholder="010-0000-0000" required style="width:100%;padding:14px 0;border:none;border-bottom:1.5px solid #c5d0c5;font-size:1rem;background:transparent;color:#3d4f42;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:36px;">
      <label style="display:block;margin-bottom:10px;font-size:0.8rem;font-weight:500;color:#4a5d52;letter-spacing:0.02em;">샘플 받을 주소 (선택)</label>
      <input type="text" name="address" placeholder="주소를 입력해주세요" style="width:100%;padding:14px 0;border:none;border-bottom:1.5px solid #c5d0c5;font-size:1rem;background:transparent;color:#3d4f42;box-sizing:border-box;">
    </div>
    <button type="submit" style="width:100%;padding:18px;background:#5a7a6a;color:#fff;border:none;font-size:0.95rem;font-weight:500;letter-spacing:0.04em;cursor:pointer;">샘플 신청하기</button>
  </form>

  <footer style="margin-top:56px;padding-top:28px;border-top:1px solid #e0e4df;font-size:0.78rem;color:#8a9a8e;">
    <p style="margin:0 0 4px 0;">ConnectSell</p>
    <p style="margin:0 0 4px 0;">커넥트셀 | CEO: 허연선 | 사업자번호 676-48-00866</p>
    <p style="margin:0;">서울 마포구 마포대로52, 13층 | connectsell01@gmail.com</p>
  </footer>
</main>
</body>
</html>
