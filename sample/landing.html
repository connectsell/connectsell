<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>샘플 신청 | ConnectSell</title>
</head>
<body style="margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f8f6f3;color:#3d4f42;">
<!-- 상단: 파란 배경 + 이미지 + 브랜드 로고 (Kakkuki) -->
<div style="width:100%;min-height:200px;background:linear-gradient(135deg,#4a90d9 0%,#5ba3e8 100%);display:flex;align-items:center;justify-content:space-between;padding:24px 32px;box-sizing:border-box;">
  <span style="font-size:1.4rem;font-weight:700;color:#fff;letter-spacing:0.02em;">Kakkuki</span>
  <div style="flex:1;max-width:280px;height:140px;margin:0 24px;background:url('https://www.connectsell.co.kr/sample/hero-bg.png') center/cover;border-radius:8px;overflow:hidden;"></div>
  <div style="width:120px;"></div>
</div>

<!-- 메인: 왼쪽 샘플상품 (참고 이미지 빨간영역 비율) | 오른쪽 신청 폼 -->
<div style="max-width:1200px;margin:0 auto;padding:40px 24px 60px;display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap;">
  <!-- 왼쪽: 약 55% 폭, 전체 높이 (참고 빨간영역) -->
  <div style="flex:1.2;min-width:320px;max-width:55%;">
    <div style="width:100%;min-height:420px;border-radius:8px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;background:#f5f5f0;">
      <img src="https://www.connectsell.co.kr/sample/images/product-1.png" alt="가꾸기 다이어트 쉐이크" style="max-width:100%;max-height:440px;width:auto;height:auto;object-fit:contain;display:block;">
    </div>
    <div style="display:flex;gap:16px;">
      <div style="flex:1;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f0f0f0;">
        <img src="https://www.connectsell.co.kr/sample/images/product-2.png" alt="칼로리 비교" style="width:100%;height:100%;object-fit:cover;display:block;">
      </div>
      <div style="flex:1;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f0f0f0;">
        <img src="https://www.connectsell.co.kr/sample/images/product-3.png" alt="가꾸기 다이어트 쉐이크 3종" style="width:100%;height:100%;object-fit:cover;display:block;">
      </div>
      <div style="flex:1;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#f0f0f0;">
        <img src="https://www.connectsell.co.kr/sample/images/product-4.png" alt="쉐이크 레이어드" style="width:100%;height:100%;object-fit:cover;display:block;">
      </div>
    </div>
  </div>

  <!-- 오른쪽: 샘플 신청 폼 (약 45%) -->
  <div style="flex:0.9;min-width:300px;max-width:420px;">
    <p style="margin:0 0 8px 0;font-size:1.2rem;font-weight:600;color:#3d4f42;line-height:1.6;">가꾸기 다이어트 쉐이크</p>
    <p style="margin:0 0 28px 0;font-size:0.9rem;color:#6b7c6e;line-height:1.5;">언제, 어디서나 나를 위해 가꾸기. 일상에 즐거움을 더해 줄 웰니스 샘플을 만나보세요.</p>

    <form action="https://formsubmit.co/connectsell01@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="[ConnectSell] 샘플 신청">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://www.connectsell.co.kr/sample/thanks.html">

      <div style="margin-bottom:20px;">
        <label style="display:block;margin-bottom:8px;font-size:0.8rem;font-weight:500;color:#4a5d52;">채널명 *</label>
        <input type="text" name="channel" placeholder="유튜브/인스타그램 채널명" required style="width:100%;padding:12px 14px;border:1px solid #e0e4df;border-radius:8px;font-size:1rem;background:#fff;color:#3d4f42;box-sizing:border-box;">
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;margin-bottom:8px;font-size:0.8rem;font-weight:500;color:#4a5d52;">이름 *</label>
        <input type="text" name="name" placeholder="본명" required style="width:100%;padding:12px 14px;border:1px solid #e0e4df;border-radius:8px;font-size:1rem;background:#fff;color:#3d4f42;box-sizing:border-box;">
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;margin-bottom:8px;font-size:0.8rem;font-weight:500;color:#4a5d52;">전화번호 *</label>
        <input type="tel" name="phone" placeholder="010-0000-0000" required style="width:100%;padding:12px 14px;border:1px solid #e0e4df;border-radius:8px;font-size:1rem;background:#fff;color:#3d4f42;box-sizing:border-box;">
      </div>
      <div style="margin-bottom:28px;">
        <label style="display:block;margin-bottom:8px;font-size:0.8rem;font-weight:500;color:#4a5d52;">샘플 받을 주소 (선택)</label>
        <input type="text" name="address" placeholder="주소를 입력해주세요" style="width:100%;padding:12px 14px;border:1px solid #e0e4df;border-radius:8px;font-size:1rem;background:#fff;color:#3d4f42;box-sizing:border-box;">
      </div>
      <button type="submit" style="width:100%;padding:16px;background:#5a7a6a;color:#fff;border:none;border-radius:8px;font-size:0.95rem;font-weight:500;cursor:pointer;">샘플 신청하기</button>
    </form>

    <footer style="margin-top:40px;padding-top:24px;border-top:1px solid #e0e4df;font-size:0.78rem;color:#8a9a8e;">
      <p style="margin:0 0 4px 0;">ConnectSell</p>
      <p style="margin:0 0 4px 0;">커넥트셀 | CEO: 허연선 | 사업자번호 676-48-00866</p>
      <p style="margin:0;">서울 마포구 마포대로52, 13층 | connectsell01@gmail.com</p>
    </footer>
  </div>
</div>
</body>
</html>
