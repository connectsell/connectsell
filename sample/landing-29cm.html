<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>샘플 신청 | ConnectSell</title>
</head>
<body style="margin:0;padding:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#fafafa;color:#1a1a1a;">
<main style="max-width:480px;margin:0 auto;padding:40px 24px 60px;">
  <a href="https://www.connectsell.co.kr/" style="display:block;margin-bottom:40px;font-size:1.1rem;font-weight:600;color:#1a1a1a;text-decoration:none;">ConnectSell</a>

  <div style="position:relative;height:280px;background:url('https://www.connectsell.co.kr/sample/hero-bg.png') center/cover;margin-bottom:40px;">
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0.35);"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;padding:24px;">
      <p style="margin:0 0 4px 0;font-size:0.8rem;color:rgba(255,255,255,0.9);letter-spacing:0.08em;">WELLNESS CREATOR COMMERCE</p>
      <p style="margin:0;font-size:1.1rem;font-weight:600;color:#fff;line-height:1.5;">브랜드와 크리에이터를 연결해<br>지속 가능한 공동구매를 만듭니다</p>
    </div>
  </div>

  <p style="margin:0 0 8px 0;font-size:1.25rem;font-weight:600;color:#1a1a1a;line-height:1.5;">당신의 진짜 리뷰가<br>브랜드의 이야기가 됩니다</p>
  <p style="margin:0 0 32px 0;font-size:0.9rem;color:#666;">아래 정보를 남겨주시면 샘플을 보내드립니다</p>

  <form action="https://formsubmit.co/connectsell01@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="[ConnectSell] 샘플 신청">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://www.connectsell.co.kr/sample/thanks.html">

    <div style="margin-bottom:20px;">
      <label style="display:block;margin-bottom:8px;font-size:0.85rem;font-weight:500;color:#333;">채널명 *</label>
      <input type="text" name="channel" placeholder="유튜브/인스타그램 채널명" required style="width:100%;padding:14px 0;border:none;border-bottom:1px solid #ddd;font-size:1rem;background:transparent;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:20px;">
      <label style="display:block;margin-bottom:8px;font-size:0.85rem;font-weight:500;color:#333;">이름 *</label>
      <input type="text" name="name" placeholder="본명" required style="width:100%;padding:14px 0;border:none;border-bottom:1px solid #ddd;font-size:1rem;background:transparent;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:20px;">
      <label style="display:block;margin-bottom:8px;font-size:0.85rem;font-weight:500;color:#333;">전화번호 *</label>
      <input type="tel" name="phone" placeholder="010-0000-0000" required style="width:100%;padding:14px 0;border:none;border-bottom:1px solid #ddd;font-size:1rem;background:transparent;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:32px;">
      <label style="display:block;margin-bottom:8px;font-size:0.85rem;font-weight:500;color:#333;">샘플 받을 주소 (선택)</label>
      <input type="text" name="address" placeholder="주소를 입력해주세요" style="width:100%;padding:14px 0;border:none;border-bottom:1px solid #ddd;font-size:1rem;background:transparent;box-sizing:border-box;">
    </div>
    <button type="submit" style="width:100%;padding:16px;background:#1a1a1a;color:#fff;border:none;font-size:0.95rem;font-weight:500;cursor:pointer;">샘플 신청하기</button>
  </form>

  <footer style="margin-top:48px;padding-top:24px;border-top:1px solid #eee;font-size:0.8rem;color:#999;">
    <p style="margin:0 0 4px 0;">ConnectSell</p>
    <p style="margin:0 0 4px 0;">커넥트셀 | CEO: 허연선 | 사업자번호 676-48-00866</p>
    <p style="margin:0;">서울 마포구 마포대로52, 13층 | connectsell01@gmail.com</p>
  </footer>
</main>
</body>
</html>
